<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>jQuery vs Native JS</title>
    <style>
        .myStyle { background-color: coral; padding: 16px; }
    </style>
   
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>

    <div id="myElement">Original Text</div>
    <div id="myDIV"><p>I am a myDIV.</p></div>
    <button id="myButton">Click me</button>

    <script>
        $(document).ready(function() {
            
            $("#myElement").text("Modified Text");
            // (a) document.getElementById("myElement").textContent = "Modified Text"; 
            
            $("#myDIV").addClass("myStyle");
            // (b) document.querySelector("#myDIV").classList.add("myStyle"); 


            $("#myButton").on("click", function() {
                alert("Button clicked!");
                // (c) document.getElementById("myButton").addEventListener("click", function() 

            });
        });
    </script>

</body>
</html>
